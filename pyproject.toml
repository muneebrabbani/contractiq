[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contractiq"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pymupdf",
    "python-docx",
    "pytesseract",
    "pillow",
    "tiktoken",
    "spacy",
    "sqlalchemy",
    "ragas",
    "langchain-community<0.4",
    "chromadb",
    "rank-bm25",
    "sentence-transformers",
    "langgraph",
    "streamlit",
]

[tool.setuptools.packages.find]
where = ["src"]
